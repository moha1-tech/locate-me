services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: locateme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: locateme
    volumes:
      - locateme_pg_data:/var/lib/postgresql/data

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # Signaling (7880/tcp) is NOT published here: it's only reachable inside
      # the Docker network, via Caddy's reverse proxy on :48444. Only the RTC
      # media range needs a direct host/router port, since WebRTC UDP can't
      # be proxied through Caddy.
      - "41000-41050:41000-41050/udp"

  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://locateme:${POSTGRES_PASSWORD}@postgres:5432/locateme?schema=public
    depends_on:
      - postgres
      - livekit

  caddy:
    build:
      context: .
      dockerfile: Caddy.Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "48443:48443"
      - "48444:48444"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - livekit

volumes:
  locateme_pg_data:
  caddy_data:
  caddy_config:
